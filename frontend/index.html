<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT GitHub Demo Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Calculator</h1>
    <input id="display" type="text" value="0" readonly aria-label="Calculator display">
    <div class="keys">
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-op="divide">÷</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-op="multiply">×</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-op="subtract">−</button>
      <button data-value="0">0</button><button data-action="clear">C</button><button data-action="equals">=</button><button data-op="add">+</button>
    </div>
    <p id="status" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
